[package]
name = "zenith-asset"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { workspace = true }
parking_lot = { workspace = true }
glam = { workspace = true }

rayon = { version = "1.10", optional = true }
ispc-texcomp = { version = "0.1.20", optional = true }
zstd = { version = "0.13.3", default-features = false }
half = { version = "2.7.1", optional = true }
gltf = { version = "1.4", optional = true, default-features = false, features = ["import", "utils"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "hdr", "bmp", "tga", "tiff", "webp"] }
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"


[features]
default = ["importers"]
parallel = ["dep:rayon"]
importers = ["parallel", "dep:ispc-texcomp", "dep:half", "dep:gltf", "dep:image"]
extra-image-formats = ["importers", "image/default-formats"]
